<section class="schema-module">
  <app-user-admin-listview
    *ngIf="isListMode()"
    [title]="'UserAdmin List'"
    [items]="items"
    [isLoading]="isLoading"
    [getItemName]="getItemName.bind(this)"
    [getItemId]="getItemId.bind(this)"
    (createNew)="openNew()"
    (editItem)="openEdit($event)"
  ></app-user-admin-listview>

  <app-user-admin-formedit
    *ngIf="isEditMode()"
    [title]="'UserAdmin Edit'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-user-admin-formedit>

  <app-user-admin-formnew
    *ngIf="isNewMode()"
    [title]="'UserAdmin Create'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-user-admin-formnew>
</section>
