<section class="schema-module">
  <app-user-client-listview
    *ngIf="isListMode()"
    [title]="'UserClient List'"
    [items]="items"
    [isLoading]="isLoading"
    [getItemName]="getItemName.bind(this)"
    [getItemId]="getItemId.bind(this)"
    (createNew)="openNew()"
    (editItem)="openEdit($event)"
  ></app-user-client-listview>

  <app-user-client-formedit
    *ngIf="isEditMode()"
    [title]="'UserClient Edit'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-user-client-formedit>

  <app-user-client-formnew
    *ngIf="isNewMode()"
    [title]="'UserClient Create'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-user-client-formnew>
</section>
