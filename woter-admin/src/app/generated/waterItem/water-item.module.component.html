<section class="schema-module">
  <app-water-item-listview
    *ngIf="isListMode()"
    [title]="'WaterItem List'"
    [items]="items"
    [isLoading]="isLoading"
    [getItemName]="getItemName.bind(this)"
    [getItemId]="getItemId.bind(this)"
    (createNew)="openNew()"
    (editItem)="openEdit($event)"
  ></app-water-item-listview>

  <app-water-item-formedit
    *ngIf="isEditMode()"
    [title]="'WaterItem Edit'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-water-item-formedit>

  <app-water-item-formnew
    *ngIf="isNewMode()"
    [title]="'WaterItem Create'"
    [form]="form"
    [fields]="fields"
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isSaving]="isSaving"
    (back)="goToList()"
    (save)="save()"
  ></app-water-item-formnew>
</section>
