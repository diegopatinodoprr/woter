<div class="module-list">
  <div class="module-list-header">
    <h3>{{ title }}</h3>
    <p-button type="button" label="Nouveau" icon="pi pi-plus" (onClick)="createNew.emit()"></p-button>
  </div>

  <p *ngIf="isLoading">Chargement...</p>
  <p *ngIf="!isLoading && items.length === 0">Aucun element.</p>

  <p-table *ngIf="!isLoading && items.length > 0" [value]="items" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th style="width: 8rem">Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ getItemName(item) }}</td>
        <td>{{ getItemId(item) }}</td>
        <td>
          <p-button
            type="button"
            label="Edit"
            icon="pi pi-pencil"
            size="small"
            [text]="true"
            (onClick)="editItem.emit(item)"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
