<main class="dashboard-page">
  <aside class="sidebar">
    <h2>Woter Admin</h2>
    <section class="sidebar-profile">
      <img [src]="logoPath" alt="Woter Logo" class="sidebar-logo" />
      <div class="sidebar-user">
        <strong>Bienvenue {{ connectedUserName }}</strong>
      </div>
    </section>
    <p-divider />
    <nav>
      <a
        *ngFor="let module of modules"
        class="nav-item"
        [class.active]="isActiveModule(module.key)"
        [routerLink]="['/dashboard', module.key, 'list']"
      >
        {{ module.label }}
      </a>
    </nav>

    <p-button
      label="Logout"
      icon="pi pi-sign-out"
      severity="secondary"
      [outlined]="true"
      (onClick)="logout()"
    ></p-button>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <span class="p-input-icon-left search-wrap">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Rechercher..." />
      </span>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a [routerLink]="['/dashboard']">Dashboard</a>
        <ng-container *ngIf="hasSelectedModule()">
          <span class="sep">/</span>
          <a [routerLink]="['/dashboard', selectedModuleKey, 'list']">
            {{ getSelectedModuleLabel() }}
          </a>
        </ng-container>
        <ng-container *ngIf="hasActionCrumb()">
          <span class="sep">/</span>
          <span>{{ getActionLabel() }}</span>
        </ng-container>
      </nav>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </section>
</main>
