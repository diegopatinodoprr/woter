<main class="login-page">
  <section class="login-card">
    <h1>Admin Login</h1>
    <p>Connecte-toi pour acceder au dashboard d'administration.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" pInputText formControlName="email" placeholder="admin@woter.com" />

      <label for="password">Mot de passe</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        [inputStyle]="{ width: '100%' }"
      ></p-password>

      @if (errorMessage) {
        <p class="error-msg">{{ errorMessage }}</p>
      }

      <p-button
        type="submit"
        label="Login"
        icon="pi pi-sign-in"
        [loading]="isSubmitting"
        [disabled]="isSubmitting"
      ></p-button>
    </form>
  </section>
</main>
