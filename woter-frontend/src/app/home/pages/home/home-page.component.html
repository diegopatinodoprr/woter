<div class="home-layout">
  <header class="hero">
    <p-tag severity="info" value="Woter Frontend"></p-tag>
    <h1>Trouvez une fontaine fiable près de vous</h1>
    <p>Suivez la qualité de l'eau en temps réel et préparez vos trajets urbains ou sportifs.</p>

    <div class="search-row">
      <input
        pInputText
        type="search"
        placeholder="Ville, quartier, parc ou itinéraire..."
        aria-label="Recherche d'une fontaine"
      />
      <p-button label="Rechercher" icon="pi pi-search"></p-button>
    </div>

    <div class="actions" aria-label="Actions rapides">
      @for (action of quickActions; track action.label) {
        <p-button
          [label]="action.label"
          [icon]="action.icon"
          severity="secondary"
          [outlined]="action.label !== 'Connexion'"
          (onClick)="onQuickActionClick(action.label)"
        ></p-button>
      }
    </div>
  </header>

  <main class="map-area">
    <app-home-map></app-home-map>
  </main>

  <footer class="site-footer">
    <span>© 2026 Woter</span>
    <a href="#">Mentions légales</a>
    <a href="#">Confidentialité</a>
    <a href="#">Contact</a>
  </footer>
</div>

<p-dialog
  header="Connexion"
  [modal]="true"
  [(visible)]="showLoginModal"
  [style]="{ width: '26rem', maxWidth: '95vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeLoginModal()"
>
  <form class="login-form" (ngSubmit)="submitLogin()">
    <label for="login-field">Email</label>
    <input id="login-field" name="login" type="email" pInputText [(ngModel)]="loginValue" />

    <label for="password-field">Mot de passe</label>
    <input
      id="password-field"
      name="password"
      type="password"
      pInputText
      [(ngModel)]="passwordValue"
    />

    @if (loginError) {
      <p class="error-message">{{ loginError }}</p>
    }

    <p-button
      type="submit"
      [label]="isSubmitting ? 'Connexion en cours...' : 'Se connecter'"
      [loading]="isSubmitting"
      [disabled]="isSubmitting"
    ></p-button>
  </form>
</p-dialog>
